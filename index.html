<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A simple to-do list that saves your tasks in this browser." />
  <title>My Tasks | Naman Bansal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="todo.css" />
  <script src="todo.js" defer></script>
</head>
<body>
  <header class="todo-header">
    <a class="brand" href="../index.html" aria-label="Naman Bansal project hub"><span class="brand-mark">N</span><span>naman<span class="muted">.dev</span></span></a>
    <nav class="todo-nav" aria-label="Main navigation">
      <a class="home-link" href="../index.html">Home</a>
      <a class="back-link" href="../naman_bansal_portfolio/index.html#projects">Portfolio</a>
    </nav>
  </header>

  <main class="todo-main">
    <section class="todo-panel" aria-labelledby="todo-title">
      <p class="eyebrow">A LITTLE PROGRESS, EVERY DAY</p>
      <div class="todo-heading">
        <div>
          <h1 id="todo-title">My tasks<span>.</span></h1>
          <p>Write it down. Make it happen.</p>
        </div>
        <div class="todo-total" aria-live="polite"><strong id="remainingCount">0</strong><span>left to do</span></div>
      </div>

      <form class="todo-form" id="todoForm">
        <label class="visually-hidden" for="todoInput">Add a task</label>
        <input id="todoInput" name="task" type="text" maxlength="160" placeholder="What needs to get done?" autocomplete="off" required />
        <button type="submit">Add task <span>＋</span></button>
      </form>

      <div class="todo-toolbar">
        <div class="todo-filters" role="group" aria-label="Filter tasks">
          <button type="button" class="todo-filter is-active" data-filter="all" aria-pressed="true">All</button>
          <button type="button" class="todo-filter" data-filter="active" aria-pressed="false">Active</button>
          <button type="button" class="todo-filter" data-filter="completed" aria-pressed="false">Completed</button>
        </div>
        <button type="button" class="todo-clear" id="clearCompleted">Clear completed</button>
      </div>

      <p class="todo-status" id="todoStatus" role="status" aria-live="polite">Your tasks are saved in this browser.</p>
      <ul class="todo-list" id="todoList" aria-label="Tasks"></ul>
      <p class="todo-empty" id="todoEmpty">Nothing here yet. Add a task to get started.</p>
      <p class="todo-footnote">Your list is stored locally in this browser and is not synced to other devices.</p>
    </section>
  </main>
</body>
</html>
